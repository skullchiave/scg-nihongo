<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="/scg-nihongo/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/scg-nihongo/icon-192.png">
<link rel="manifest" href="/scg-nihongo/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="SCG日本語">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>JLPT N4 語彙ドリル</title>
<style>
@font-face{font-family:'SCG Kyokasho';font-style:normal;font-weight:400;src:local('UD Digi Kyokasho NK'),local('UDDigiKyokashoNK'),local('UD Digi Kyokasho NK-R'),local('UDDigiKyokashoNK-R');}
@font-face{font-family:'SCG Kyokasho';font-style:normal;font-weight:700;src:local('UD Digi Kyokasho NK Bold'),local('UDDigiKyokashoNK-Bold'),local('UD Digi Kyokasho NK-B'),local('UDDigiKyokashoNK-B');}
@font-face{font-family:'BIZ UDPGothic';font-style:normal;font-weight:400;font-display:swap;src:url('/scg-nihongo/fonts/BIZUDPGothic-Regular.subset.woff2') format('woff2');}
@font-face{font-family:'BIZ UDPGothic';font-style:normal;font-weight:700;font-display:swap;src:url('/scg-nihongo/fonts/BIZUDPGothic-Bold.subset.woff2') format('woff2');}
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#16233a; --sub:#5a6b86; --line:#c9d4e6; --hair:#dfe5ef;
  --accentT:#b45309; --accentSoft:#fff3e0; --accentStrong:#d97706; --muted:#3c4c66;
  --ok:#15803d; --ng:#dc2626; --okSoft:#e7f5ec; --ngSoft:#fdecec;
  --card-shadow:0 1px 2px rgba(22,35,58,.06),0 4px 16px rgba(22,35,58,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:"SCG Kyokasho","BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;line-height:1.6;}
button,select,input{font-family:inherit;color:inherit;}
button{-webkit-tap-highlight-color:transparent;cursor:pointer;}
rt{font-size:.5em;font-weight:500;color:var(--sub);}
body.noruby rt{display:none;}
.ic{width:22px;height:22px;flex-shrink:0;display:block;}
.hidden{display:none !important;}

/* ヘッダー */
.hd{flex-shrink:0;background:#fff;border-bottom:1px solid var(--hair);}
.hdrow{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:60px;}
.ibtn{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;border:1px solid transparent;
  background:none;color:var(--ink);text-decoration:none;}
.ibtn.frame{border-color:var(--line);background:#fff;}
.ibtn:active{transform:scale(.95);}
.ttl{flex:1;min-width:0;padding-left:2px;}
.ttl-s{font-size:11px;color:var(--sub);font-weight:700;line-height:1.3;}
.ttl-m{font-size:17px;font-weight:700;line-height:1.4;}
.rubybtn{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--sub);flex-shrink:0;}
.rubybtn[aria-pressed="true"]{background:var(--accentSoft);color:var(--accentT);border-color:#f3d9ad;}
.aabtn{font-size:15px;font-weight:700;}
.aabtn.on{background:var(--accentSoft);color:var(--accentT);border-color:#f3d9ad;}
.bar{flex:1;height:8px;background:#e6ebf3;border-radius:99px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--accentStrong);border-radius:99px;transition:width .25s;}
.qcount{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:8px;}

/* 本文 */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page{max-width:600px;margin:0 auto;padding:18px 16px 24px;}
.h{font-size:22px;font-weight:700;line-height:1.4;}
.lead{font-size:13px;color:var(--muted);margin-top:2px;}

/* 1. 練習メニュー */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:16px;box-shadow:var(--card-shadow);margin-top:16px;}
.stats > div{text-align:center;padding:12px 4px;border-left:1px solid #edf1f7;}
.stats > div:first-child{border-left:none;}
.stats b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;}
.stats span{font-size:11px;color:var(--sub);font-weight:700;}
.lbl{display:block;font-size:13px;font-weight:700;margin:18px 0 6px;}
.selwrap{position:relative;}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;height:52px;border-radius:14px;border:1px solid var(--line);
  background:#fff;font-size:16px;padding:0 44px 0 14px;color:var(--ink);}
.cf{display:block;}
.ct{display:block;font-size:.72em;font-weight:500;color:var(--sub);line-height:1.8;}
.catruby{margin:6px 4px 0;font-size:15px;font-weight:700;color:var(--muted);line-height:2;}
.selwrap .ic{position:absolute;right:14px;top:15px;pointer-events:none;color:var(--sub);}
.bigbtn{width:100%;min-height:68px;margin-top:16px;border:none;border-radius:16px;background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:14px;padding:8px 20px;text-align:left;}
.bigbtn b{display:block;font-size:18px;line-height:1.3;}
.bigbtn small{display:block;font-size:12px;color:#c9d4e6;}
.bigbtn:active,.nextbtn:active,.btn-main:active{transform:scale(.99);}
.list{background:#fff;border-radius:16px;box-shadow:var(--card-shadow);overflow:hidden;margin-top:12px;}
.row{width:100%;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px 8px 16px;border:none;border-top:1px solid #edf1f7;
  background:#fff;text-align:left;font-size:15px;font-weight:700;}
.row:first-child{border-top:none;}
.row .cnt{margin-left:auto;font-size:13px;color:var(--sub);font-weight:400;white-space:nowrap;}
.row .go{color:#8a98b0;}
.row:disabled{background:#f7f9fc;color:#8a98b0;cursor:default;}
.row:disabled .cnt{color:#8a98b0;}
.linkbtn{display:block;margin:16px auto 0;height:44px;padding:0 12px;background:none;border:none;font-size:13px;color:var(--sub);text-decoration:underline;}
.confirm{background:var(--ngSoft);border-radius:16px;padding:14px 16px;margin-top:8px;font-size:15px;font-weight:700;text-align:center;}
.confirm .two{display:flex;gap:8px;margin-top:10px;}
.confirm button{flex:1;height:48px;border-radius:12px;font-size:15px;font-weight:700;}
.btn-danger{background:#b91c1c;color:#fff;border:none;}
.btn-plain{background:#fff;border:1px solid var(--line);}

/* 2. 問題 */
.tag{display:inline-block;font-size:12px;font-weight:700;background:#e6ebf3;color:var(--muted);border-radius:999px;padding:3px 10px;line-height:1.7;}
.qcard{background:#fff;border-radius:20px;box-shadow:var(--card-shadow);padding:18px;margin-top:10px;font-size:22px;line-height:2.3;overflow-wrap:anywhere;}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;margin:0 2px;line-height:1.4;}
.blank.filled{border-color:var(--ok);color:var(--ok);font-weight:700;}
.choices{display:grid;gap:10px;margin-top:14px;}
.choice{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:2px solid var(--hair);border-radius:16px;background:#fff;
  font-size:19px;text-align:left;line-height:1.8;color:var(--ink);}
.choice .n{flex:none;width:32px;height:32px;border-radius:50%;background:#eef1f7;display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1;}
.choice.ok{border-color:var(--ok);background:var(--okSoft);} .choice.ok .n{background:var(--ok);color:#fff;}
.choice.ng{border-color:var(--ng);background:var(--ngSoft);} .choice.ng .n{background:var(--ng);color:#fff;}
.choice.dim .n{color:#8a98b0;}
.choice:disabled{cursor:default;}
.fb{border-radius:16px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.9;}
.fb.ok{background:var(--okSoft);} .fb.ng{background:var(--ngSoft);}
.verdict{font-size:16px;font-weight:700;margin-bottom:2px;}
.fb.ok .verdict{color:var(--ok);} .fb.ng .verdict{color:#b91c1c;}
.fbfoot{display:flex;align-items:center;gap:10px;margin-top:8px;}
.fbg{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.8;}
.fbg b{color:var(--ink);}
.morebtn{flex-shrink:0;height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;background:#fff;border:1px solid var(--line);
  border-radius:12px;font-size:13px;font-weight:700;color:var(--ink);}
.morebtn .ic{width:18px;height:18px;}
.kbd{font-size:12px;color:var(--sub);text-align:center;margin-top:14px;}
@media (max-width:640px){ .kbd{display:none;} }

/* 下の段（タブ／つぎへ） */
.bottom{flex-shrink:0;background:#fff;border-top:1px solid var(--hair);padding:8px 16px max(12px, env(safe-area-inset-bottom));}
.bottomin{max-width:568px;margin:0 auto;}
.nextbtn{width:100%;height:60px;border:none;border-radius:16px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:4px;}
.waithint{height:60px;display:grid;place-items:center;font-size:13px;color:var(--sub);}
.tabsbar{padding:6px 8px max(16px, env(safe-area-inset-bottom));}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:568px;margin:0 auto;}
.tab{height:54px;border:none;background:none;border-radius:14px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;line-height:1.2;}
.tab rt{font-size:.6em;}
.tab[aria-current="page"]{background:var(--accentSoft);color:var(--accentT);font-weight:700;}

/* 4. けっか */
.scorecard{background:#fff;border-radius:20px;box-shadow:var(--card-shadow);padding:24px 20px;text-align:center;}
.big{font-size:56px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;}
.big small{font-size:22px;font-weight:700;color:var(--sub);}
.rbar{height:10px;border-radius:5px;background:var(--ngSoft);overflow:hidden;margin:16px 0 10px;}
.rbar i{display:block;height:100%;background:var(--ok);}
.r3{display:flex;justify-content:space-between;font-size:13px;gap:6px;}
.r3 .g{color:var(--ok);font-weight:700;} .r3 .r{color:#b91c1c;font-weight:700;}
.sech{font-size:13px;font-weight:700;margin:20px 0 8px;}
.wrow{padding:10px 16px;min-height:56px;border-top:1px solid #edf1f7;}
.wrow:first-child{border-top:none;}
.wrow b{display:block;font-size:16px;line-height:1.6;} .wrow span{font-size:13px;color:var(--sub);}
.allok{text-align:center;color:var(--sub);padding:16px;font-weight:700;}
.btn-main{width:100%;height:60px;border:none;border-radius:16px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;}
.btn-main:disabled{opacity:.4;cursor:default;}
.btn-sub{width:100%;height:52px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:15px;font-weight:700;margin-top:10px;}

/* 5. 文法リスト */
.searchwrap{position:relative;margin-bottom:6px;}
.searchwrap input{width:100%;height:48px;border-radius:14px;background:#f7f9fc;border:1px solid var(--line);font-size:16px;padding:0 14px 0 42px;color:var(--ink);}
.searchwrap .ic{position:absolute;left:12px;top:13px;color:var(--sub);}
.info{font-size:12px;color:var(--sub);}
.cath{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 8px;}
.cath > span{font-size:15px;font-weight:700;color:var(--accentT);line-height:1.6;}
.catgo{flex-shrink:0;height:44px;padding:0 14px;border:none;border-radius:22px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;}
.catgo .ic{width:16px;height:16px;}
.gcard{background:#fff;border-radius:16px;box-shadow:var(--card-shadow);padding:14px 16px;margin-bottom:10px;}
.gtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.gname{font-size:19px;font-weight:700;line-height:1.6;}
.gmean{font-size:14px;margin-top:2px;line-height:1.8;}
.gform{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.8;}
.gex{background:#f7f9fc;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:16px;line-height:2.1;}
.ans{color:var(--accentT);font-weight:700;}
.del{text-decoration:line-through;text-decoration-thickness:2px;}  /* 連用形接続：ます形の「ます」をとる */
.pill{flex-shrink:0;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:4px;}
.pill.good{background:var(--okSoft);color:var(--ok);} .pill.bad{background:var(--ngSoft);color:#b91c1c;} .pill.none{background:#e6ebf3;color:var(--sub);}

/* 3. 文法の説明シート */
.shov{position:fixed;inset:0;background:rgba(22,35,58,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;width:100%;max-width:600px;max-height:78vh;max-height:78dvh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:8px 16px max(16px, env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.15);}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px;}
.shtop{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.shclose{border-radius:50%;background:#eef1f7;}
.shname{font-size:26px;font-weight:700;line-height:1.5;margin-top:4px;}
.shmean{font-size:15px;line-height:1.8;}
.shtbl{display:grid;grid-template-columns:64px 1fr;gap:10px 8px;margin-top:14px;align-items:baseline;}
.shtbl dt{font-size:12px;font-weight:700;color:var(--sub);}
.shtbl dd{font-size:15px;line-height:1.8;}
.shtbl dd.ex{font-size:16px;line-height:2.1;}
.shsep{height:1px;background:#edf1f7;margin:16px 0 12px;}
.shsim{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px;line-height:1.8;}
.sims{display:flex;flex-wrap:wrap;gap:8px;}
.sim{min-height:44px;padding:4px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;line-height:1.6;color:var(--ink);}
.sim[aria-current="true"]{background:var(--accentSoft);border-color:#f3d9ad;color:var(--accentT);font-weight:700;}
.shback{width:100%;height:52px;border:none;border-radius:16px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;margin-top:18px;}

/* 翻訳コピー対応: 本文は選択可・操作部は選択不可 */
body{-webkit-user-select:text;user-select:text;}
button,.hd,.bottom,.choice{-webkit-user-select:none;user-select:none;}

/* ===== PC版（641px以上）。寸法は 1920×1080 基準で書き、applyZoom() が画面に合わせて全体を縮める =====
   スマホ版（640px以下）の見た目はここより上だけで決まる。.pconly は PC 幅でだけ出す部品 */
.pconly{display:none;}
@media (min-width:641px){
  rt{font-size:.45em;}
  /* ヘッダー */
  .hdrow{max-width:1816px;height:104px;padding:0 48px;gap:16px;}
  .ibtn{width:64px;height:64px;border-radius:16px;}
  .ibtn .ic{width:32px;height:32px;}
  .ttl{flex:none;font-size:34px;font-weight:700;padding-right:12px;white-space:nowrap;}
  .seg{display:flex;gap:4px;background:#e6ebf3;border-radius:16px;padding:4px;}
  .seg button{height:56px;padding:0 28px;border:none;border-radius:12px;background:none;font-size:24px;color:var(--sub);}
  .seg button[aria-current="page"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(22,35,58,.15);}
  .hdsp{flex:1;}
  .rubybtn{height:64px;padding:0 22px;border-radius:16px;font-size:24px;}
  .aabtn{font-size:24px;}
  .xbtn{height:64px;display:inline-flex;align-items:center;gap:8px;padding:0 22px 0 14px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:24px;font-weight:700;flex-shrink:0;}
  .xbtn .ic{width:30px;height:30px;}
  .hdrow .tag{font-size:22px;padding:6px 18px;flex-shrink:0;}
  .bar{height:14px;margin:0 8px;}
  .qcount{font-size:32px;padding-right:12px;}
  .qcount + .hdsp{flex:0 0 24px;}
  .bottom{display:none !important;}   /* PC版は下のタブ・つぎへ を使わない */
  .page{max-width:1816px;padding:36px 48px 40px;}
  /* 1. 練習メニュー */
  /* 右の列は1行ずつ並べ、左の列（分野）は全行にまたがせる。最後の 1fr 行が余りを吸うので右の列の間が空かない */
  #setup:not(.hidden){display:grid;grid-template-columns:520px minmax(0,1fr);grid-template-rows:repeat(8,auto) 1fr;column-gap:40px;align-items:start;}
  #setup > *{grid-column:2;}
  .catlist{display:flex;flex-direction:column;grid-column:1 !important;grid-row:1 / -1;background:#fff;border-radius:28px;box-shadow:var(--card-shadow);padding:16px;gap:4px;}
  .catlist button{min-height:52px;display:flex;align-items:center;gap:12px;padding:6px 16px;border:none;border-radius:14px;background:none;text-align:left;font-size:22px;line-height:1.5;color:var(--ink);}
  .catlist button .n{margin-left:auto;font-size:20px;color:var(--sub);white-space:nowrap;}
  .catlist button[aria-pressed="true"]{background:var(--accentSoft);color:var(--accentT);font-weight:700;}
  .catlist button[aria-pressed="true"] .n{color:var(--accentT);}
  .catlist button:hover{background:#f7f9fc;} .catlist button[aria-pressed="true"]:hover{background:var(--accentSoft);}
  .sethd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;}
  .h{font-size:52px;}
  .lead{font-size:26px;}
  .catpill{display:inline-block;flex-shrink:0;font-size:24px;font-weight:700;background:var(--accentSoft);color:var(--accentT);border-radius:999px;padding:8px 24px;line-height:1.6;}
  .stats{border-radius:28px;margin-top:28px;}
  .stats > div{padding:18px 8px;}
  .stats b{font-size:64px;line-height:1.25;}
  .stats span{font-size:22px;}
  .lbl,.selwrap,.catruby{display:none;}
  .bigbtn{min-height:150px;margin-top:28px;border-radius:28px;gap:28px;padding:16px 48px;}
  .bigbtn .ic{width:64px;height:64px;}
  .bigbtn b{font-size:48px;line-height:1.4;}
  .bigbtn small{font-size:24px;}
  #setup .list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;background:none;box-shadow:none;overflow:visible;margin-top:28px;}
  #setup .row{min-height:130px;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:16px 28px;border:2px solid transparent;border-radius:24px;box-shadow:var(--card-shadow);font-size:32px;line-height:1.5;}
  #setup .row .cnt{margin-left:0;font-size:22px;}
  #setup .row .go{display:none;}
  #setup .row:disabled{background:#f7f9fc;border:2px dashed var(--line);box-shadow:none;}
  #setup .row:hover:not(:disabled){border-color:var(--line);}
  .linkbtn{font-size:20px;height:56px;margin-top:20px;}
  .confirm{font-size:24px;border-radius:24px;padding:20px;}
  .confirm button{height:64px;font-size:24px;border-radius:16px;}
  /* 2. 問題 */
  #quiz:not(.hidden){display:grid;grid-template-columns:minmax(0,1fr) 560px;grid-template-rows:repeat(6,auto) 1fr;column-gap:36px;align-items:start;}
  #quiz > *{grid-column:1;}
  #qCat,.fb{display:none !important;}
  .qcard{margin-top:0;border-radius:28px;padding:44px 52px;font-size:52px;line-height:2.1;}
  .blank{border-bottom-width:4px;}
  .choices{grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;}
  .choice{min-height:128px;border-width:3px;border-radius:24px;gap:22px;padding:12px 28px;font-size:42px;line-height:1.6;}
  .choice .n{width:64px;height:64px;font-size:30px;}
  .choice:hover:not(:disabled){border-color:var(--line);}
  .qfoot{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px;min-height:96px;}
  .kbd{margin:0;font-size:20px;text-align:left;}
  .nextpc{display:flex;align-items:center;justify-content:center;gap:8px;height:96px;min-width:340px;padding:0 48px;border:none;border-radius:24px;background:var(--ink);color:#fff;font-size:34px;font-weight:700;}
  .nextpc .ic{width:38px;height:38px;}
  .gpanel{display:block;grid-column:2 !important;grid-row:1 / -1;background:#fff;border-radius:28px;box-shadow:var(--card-shadow);padding:28px;}
  .gwait{border:3px dashed var(--line);border-radius:20px;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--sub);font-size:24px;text-align:center;line-height:1.7;padding:24px;}
  .gwait .ic{width:64px;height:64px;}
  .gv{border-radius:20px;padding:18px 22px;font-size:22px;line-height:1.8;}
  .gv.ok{background:var(--okSoft);} .gv.ng{background:var(--ngSoft);}
  .gv .verdict{font-size:34px;margin-bottom:4px;}
  .gv.ok .verdict{color:var(--ok);} .gv.ng .verdict{color:#b91c1c;}
  .gpanel .gname{font-size:44px;line-height:1.5;margin-top:20px;display:block;}
  .gpanel .gmean2{font-size:24px;line-height:1.7;}
  .gtbl{display:grid;grid-template-columns:88px 1fr;gap:12px 12px;margin-top:18px;align-items:baseline;}
  .gtbl dt{font-size:20px;font-weight:700;color:var(--sub);}
  .gtbl dd{font-size:24px;line-height:1.7;}
  .pill{font-size:20px;padding:3px 14px;}
  .gpanel .shsep{margin:20px 0 14px;}
  .gpanel .shsim{font-size:20px;}
  .gpanel .sims{gap:10px;}
  .gpanel .sim{min-height:52px;padding:4px 18px;font-size:22px;}
  /* 4. けっか */
  #result:not(.hidden){display:grid;grid-template-columns:1fr 1fr;column-gap:20px;max-width:1100px;margin:0 auto;}
  #result > :not(.btn-main):not(.btn-sub){grid-column:1 / -1;}
  .scorecard{border-radius:28px;padding:36px 48px;}
  .big{font-size:120px;}
  .big small{font-size:48px;}
  .rbar{height:20px;border-radius:10px;margin:24px 0 16px;}
  .r3{font-size:28px;}
  .sech{font-size:24px;margin:28px 0 12px;}
  #rWrong .list{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:none;box-shadow:none;overflow:visible;margin-top:0;}
  .wrow{background:#fff;border:none;border-radius:20px;box-shadow:var(--card-shadow);padding:16px 24px;}
  .wrow b{font-size:36px;line-height:1.5;} .wrow span{font-size:24px;}
  .allok{font-size:28px;padding:28px;}
  .btn-main,.btn-sub{height:96px;margin-top:28px;border-radius:24px;font-size:30px;}
  .btn-main .ic{width:36px;height:36px;}
  /* 5. 文法リスト */
  #list:not(.hidden){display:grid;grid-template-columns:440px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:36px;align-items:start;}
  #list > *{grid-column:2;}
  #listBody{grid-row:2;}
  .toc{display:flex;flex-direction:column;gap:4px;grid-column:1 !important;grid-row:1 / -1;position:sticky;top:24px;background:#fff;border-radius:28px;box-shadow:var(--card-shadow);padding:16px;}
  .toc button{min-height:52px;display:flex;align-items:center;gap:12px;padding:6px 16px;border:none;border-radius:14px;background:none;text-align:left;font-size:21px;line-height:1.5;color:var(--ink);}
  .toc button .n{margin-left:auto;font-size:20px;color:var(--sub);}
  .toc button.cur{background:var(--accentSoft);color:var(--accentT);font-weight:700;}
  .toc button:disabled{color:#8a98b0;cursor:default;}
  .searchwrap{grid-row:1;margin-bottom:0;}
  .searchwrap input{height:76px;border:2px solid var(--line);border-radius:20px;font-size:26px;padding:0 220px 0 64px;background:#fff;}
  .searchwrap .ic{left:20px;top:22px;width:32px;height:32px;}
  .info{grid-row:1;justify-self:end;align-self:center;font-size:22px;padding-right:28px;position:relative;pointer-events:none;}
  #listBody{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}
  .cath{grid-column:1 / -1;margin:24px 0 0;}
  .cath > span{font-size:34px;}
  .catgo{height:64px;padding:0 28px;border-radius:32px;font-size:22px;gap:10px;}
  .catgo .ic{width:24px;height:24px;}
  .gcard{margin:0;border-radius:24px;padding:28px 32px;}
  .gname{font-size:40px;}
  .gmean{font-size:24px;}
  .gform{font-size:20px;}
  .gex{font-size:30px;line-height:2;border-radius:16px;padding:12px 20px;margin-top:14px;}
}

/* ===== ここから語彙ドリルだけの見た目（上は jlpt/N4_bunpou.html の <style> を組み立て時にそのまま写したもの） ===== */
.opts{background:#fff;border-radius:16px;box-shadow:var(--card-shadow);margin-top:12px;padding:12px 16px;}
.opts .ol{display:block;font-size:13px;font-weight:700;margin:0 0 6px;}
.opts .og + .og{margin-top:14px;}
.selwrap2{position:relative;}
.selwrap2 select{appearance:none;-webkit-appearance:none;width:100%;height:48px;border-radius:12px;border:1px solid var(--line);
  background:#fff;font-size:16px;padding:0 44px 0 14px;color:var(--ink);}
.selwrap2 .ic{position:absolute;right:14px;top:13px;pointer-events:none;color:var(--sub);}
.kjinfo{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.9;}
.kjinfo b{color:var(--ink);font-variant-numeric:tabular-nums;}
.qt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.qt button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px;font-weight:700;color:var(--sub);line-height:1.4;padding:4px 2px;}
.qt button[aria-pressed="true"]{background:var(--accentSoft);color:var(--accentT);border-color:#f3d9ad;}
.qt button:disabled{opacity:.45;cursor:default;}
.tr[lang="zh-CN"]{font-family:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;}
.tr[lang="vi"]{font-family:"Segoe UI","Roboto","Noto Sans","Helvetica Neue",Arial,sans-serif;}
.tr[lang="my"]{font-family:"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif;line-height:1.9;}
#lgSel{font-family:"Segoe UI","Roboto","Noto Sans",system-ui,sans-serif;}
.lgnote{display:none;}
.lgnote.on{display:block;}
.choice.en,.qmean,.gmean,.gmean2,.shmean,.wrow span{overflow-wrap:anywhere;}
.qask{display:block;font-size:13px;font-weight:700;color:var(--sub);line-height:1.6;text-align:left;}
.qcard.word{text-align:center;}
.qword{display:block;font-size:36px;font-weight:700;line-height:2;}
.qmean{display:block;font-size:22px;font-weight:700;line-height:1.7;padding:10px 0;}
.choice.en{font-size:17px;line-height:1.5;}
.fbw{font-size:18px;font-weight:700;line-height:2;}
.qsent{display:block;font-size:22px;font-weight:700;line-height:2.4;text-align:left;padding:6px 0 2px;overflow-wrap:anywhere;}
.qsent .ch{display:inline-block;white-space:nowrap;}
.qsent .ch .ch{display:inline;}
.qsent .blank{display:inline-block;min-width:3.4em;margin:0 .15em;border-bottom:3px solid var(--accentT);color:var(--accentT);text-align:center;line-height:1.5;}
.qsent .fill{margin:0 .1em;padding:0 .15em;border-bottom:3px solid var(--accentT);color:var(--accentT);}
.fbs{display:block;font-size:15px;line-height:2.1;color:var(--sub);margin-top:2px;}
#listBody .gcard{cursor:pointer;}
.kjc{display:inline-block;margin:0 10px 2px 0;white-space:nowrap;}
.kjc b{font-size:1.25em;margin-right:4px;}
.kjc span{font-size:.85em;color:var(--sub);}
@media (min-width:641px){
  #setup:not(.hidden){grid-template-rows:repeat(10,auto) 1fr;}
  .opts{border-radius:28px;margin-top:24px;padding:20px 32px;display:grid;grid-template-columns:1fr 1fr;column-gap:32px;align-items:start;}
  .opts .og + .og{margin-top:0;}
  .opts{row-gap:20px;}
  .opts .ol{font-size:22px;margin-bottom:10px;}
  .selwrap2 select{height:72px;border-radius:16px;font-size:24px;padding:0 60px 0 20px;}
  .selwrap2 .ic{right:20px;top:22px;width:28px;height:28px;}
  .kjinfo{font-size:20px;margin-top:8px;}
  .qt{gap:10px;}
  .qt button{min-height:72px;border-radius:16px;font-size:22px;}
  .qask{font-size:24px;}
  .qword{font-size:96px;line-height:1.9;}
  .qmean{font-size:52px;line-height:1.6;padding:20px 0;}
  .qsent{font-size:44px;line-height:2.2;padding:12px 0 6px;}
  .fbs{font-size:24px;}
  .choice.en{font-size:30px;line-height:1.4;}
  .gv .fbw{font-size:30px;}
  .kjc{margin-right:20px;}
}
</style>
</head>

<script src="/scg-nihongo/assets/jlpt-kanji.js"></script>
<script>
/* ============================================================
   ★このファイルは手で直さない。組み立て道具 scripts/jlpt_goi/build_goi.py が
     語のデータ（scripts/jlpt_goi/n4_words.txt）と型（goi.tmpl.html）から作る。直すのは 語のデータ（タブ区切りの .txt）か型。
   データ形式: [しゅるい, 語, 意味, にている語の印, よみ方に出さない語は1, よみ方のまちがいの選択肢3つ]
     語は 漢字1字ずつのルビ表記 {銀|ぎん}{行|こう}。意味は {en:"…", ne:"…"} のように言語ごと（英語のほかは下書き＝LANGS の3つ目が 1）。
     よみ方のまちがいの選択肢は 語ごとに書いたもの（n4_yomi.txt）。無い語は よみ方の問題に出さない。
     「にている語の印」が同じ語どうしは、選択肢にいっしょに出さない（答えが2つに見えるのを防ぐ）。
   ★記録(localStorage n4goi_v1)のキーは「語／よみ」（例 合う/あう）。語の表記やよみを変えるとその語の記録は0にもどる。
   ★漢字で出すか ひらがなで出すかは、データではなく画面で決める：えらんだ「習った漢字」（assets/jlpt-kanji.js）に
     無い字が1つでも入る語は、語まるごと ひらがな。えらんだ範囲は jlpt_kanji_scope（語彙ドリル共通）に残る。
   記録の形・きょうの10問・定着度などは文法ドリルと同じ（assets/jlpt-study.js をそのまま使う）。
   ============================================================ */
const DATA = [

const KJ = window.JLPT_KANJI || {base:'',n4:'',steps:[]};
// N4 は「N4の漢字ぜんぶ」が最初の設定（えらんだ範囲は jlpt_kanji_scope）。N3 から上は級ごとに別に覚え、最初は「ぜんぶ漢字」
// （N4 で「初級◯課まで」をえらんだ学生が N3 を開くと、ほとんどの語が ひらがなになってしまうため）
const SCOPE_KEY='n4'==='n4' ? 'jlpt_kanji_scope' : 'jlpt_kanji_scope_n4';
const SCOPE_DEF='n4'==='n4' ? 'n4' : 'all';
let scope=SCOPE_DEF;
try{ scope=localStorage.getItem(SCOPE_KEY)||SCOPE_DEF; }catch(e){}
if(!(scope==='n4'||scope==='all'||scope==='none'||KJ.steps.some(s=>s.id===scope))) scope=SCOPE_DEF;
let KNOWN=new Set();
function buildKnown(){
  KNOWN=new Set();
  if(scope==='none'||scope==='all') return;
  if(scope==='n4'){ (KJ.n4+KJ.base).split('').forEach(k=>KNOWN.add(k)); return; }
  KJ.base.split('').forEach(k=>KNOWN.add(k));
  for(const s of KJ.steps){ s.k.split('').forEach(k=>KNOWN.add(k)); if(s.id===scope) break; }
}
const inKanji = it => it.ks.length>0 && scope!=='none' && (scope==='all' || it.ks.every(k=>KNOWN.has(k)));
const canY = it => YOMI_ON && inKanji(it) && !it.ny && !!it.yd;   // よみ方の問題に出せる語（読みが2つ以上ある語は、文脈が無いと決まらないので出さない）
const disp = it => inKanji(it) ? it.w : it.y;          // 画面に出す形（ルビ表記のまま返す）
const BOOKR = {"初級":"{初級|しょきゅう}","中級":"{中級|ちゅうきゅう}"};
const stepLabel = s => (BOOKR[s.b]||s.b)+' '+s.l;
function whereKanji(k){   // その字をどこで習うか
  const s=KJ.steps.find(x=>x.k.includes(k));
  if(s) return ruby(stepLabel(s));
  if(KJ.base.includes(k)) return 'すうじ など';
  if(KJ.n4.includes(k)) return 'N4の <ruby>漢字<rt>かんじ</rt></ruby>';
  return '―';
}

catSel.innerHTML='<option value="">すべての ことば</option>'+CAT_ORDER.map(c=>`<option value="${esc(c)}">${esc(catName(c))}</option>`).join("");
// よみ方の問題は、今のはんいで漢字で出る語だけ
const canQ = it => (qtype!=='y'||canY(it)) && (qtype!=='c'||!!it.cz);
function pool(){ const c=catSel.value; return ITEMS.filter(it=>(!c||it.cat===c)&&canQ(it)); }
function updateStats(){
  const p=pool();
  const seen=p.filter(it=>rec[it.id]);
  const wrong=p.filter(it=>rec[it.id]&&rec[it.id].last===0);
  let ok=0,tot=0; seen.forEach(it=>{ok+=rec[it.id].ok;tot+=rec[it.id].n;});
  $("sTotal").textContent=p.length; $("sSeen").textContent=seen.length;
  $("sRate").textContent=tot?Math.round(ok/tot*100)+"%":"–";
  const MON='<ruby>問<rt>もん</rt></ruby>';
  $("allCount").innerHTML=p.length+MON;
  $("wrongCount").innerHTML=wrong.length+MON; $("unseenCount").innerHTML=(p.length-seen.length)+MON;
  const c=catSel.value;
  $("catRuby").innerHTML=c?catR(c):'すべての ことば';
  $("catPill").innerHTML=$("catRuby").innerHTML;
  $("catList").innerHTML=[""].concat(CAT_ORDER).map(k=>{
    const n=ITEMS.filter(it=>(!k||it.cat===k)&&canQ(it)).length;
    return `<button data-cat="${esc(k)}" aria-pressed="${k===c}"><span>${k?catR(k):'すべての ことば'}</span><span class="n">${n}${MON}</span></button>`;
  }).join("");
  $("catList").querySelectorAll("button").forEach(b=>b.onclick=()=>{ catSel.value=b.dataset.cat; updateStats(); });
  $("wrongBtn").disabled=!wrong.length;
  document.querySelector('[data-mode="unseen"]').disabled=(p.length===seen.length);
  document.querySelector('[data-mode="random10"]').disabled=!p.length;
  document.querySelector('[data-mode="all"]').disabled=!p.length;
  // 漢字のはんい・問題のしゅるい
  const withK=ITEMS.filter(it=>it.ks.length), inK=withK.filter(inKanji);
  $("kjInfo").innerHTML='<ruby>漢字<rt>かんじ</rt></ruby>で <ruby>出<rt>で</rt></ruby>る ことば <b>'+inK.length+'</b> / '+withK.length+'　（ほかは ひらがな）';
  document.querySelectorAll("#qtBox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.qt===qtype)));
  $("qtInfo").innerHTML=QT_INFO[qtype];
}
catSel.onchange=updateStats;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- 効果音（サイト共通） ---------- */
let actx=null;
function ac(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; }
function tone(freq,delay,dur,type,vol){
  const a=ac(), t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur);
}
function sndOK(){ if(!soundOn) return; try{ tone(1318.5,0,0.15,'sine',0.3); tone(1046.5,0.15,0.6,'sine',0.3); }catch(e){} }
function sndNG(){
  if(!soundOn) return;
  try{
    const a=ac(), t=a.currentTime, dur=0.9, o=a.createOscillator(), g=a.createGain();
    o.type='square'; o.frequency.value=110;
    g.gain.setValueAtTime(0.25,t); g.gain.setValueAtTime(0.25,t+dur-0.05); g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}

/* ---------- 出題 ---------- */
let queue=[],pos=0,score=0,wrongIds=[],answered=false,cur=null,order=[],qt='m',opts=[],cz=null;
function start(list){
  if(!list.length) return;
  queue=shuffle(list); pos=0; score=0; wrongIds=[]; show("quiz"); render();
}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
  const p=pool(), m=b.dataset.mode;
  if(m==="random10") start(shuffle(p).slice(0,10));
  if(m==="all") start(p);
  if(m==="wrong") start(p.filter(it=>rec[it.id]&&rec[it.id].last===0));
  if(m==="unseen") start(p.filter(it=>!rec[it.id]));
});

// この問題の しゅるい（まぜる の時：いみ4・ことば4・よみ方2 の割合。よみ方は漢字で出る語だけ）
function pickType(it){
  if(it.cz && qtype!=='y') return 'c';          // 例文がある語は、いみ・ことば の代わりに 文の問題
  if(qtype!=='mix') return (qtype==='y'&&!canY(it))?'m':qtype;
  const r=Math.random();
  if(it.cz) return (canY(it)&&r>=0.8)?'y':'c';
  if(canY(it)) return r<0.4?'m':r<0.8?'w':'y';
  if(inKanji(it)) return r<0.5?'m':'w';
  return r<0.5?'m':'w';
}
// まちがいの選択肢を3つ。同じ しゅるい の語から、答えが2つに見えるものを外してえらぶ
function pickOthers(it,t){
  const used=new Set(), out=[];
  const keyOf = x => t==='m' ? mean(x) : t==='y' ? x.y : plain(disp(x));
  used.add(keyOf(it));
  // 訳がまったく同じ語（えらんでいる言語で）は、印が無くても いっしょに出さない（「ことば」問題で答えが2つになるため）
  const okx = x => x!==it && x.y!==it.y && x.p!==it.p && !(t!=='y' && it.tag && x.tag===it.tag) && (t!=='y' || inKanji(x)) && (t==='y' || mean(x)!==mean(it));
  const take = xs => { for(const x of shuffle(xs)){ if(out.length>=3) break; const k=keyOf(x); if(used.has(k)||!okx(x)) continue; used.add(k); out.push(x); } };
  if(t==='c') return cz.slice(1,4).map(x=>({c:x}));   // 文の問題：例文ごとに書いた まちがいの語
  if(t==='y') return it.yd.map(y=>({y:y}));   // よみ方：語ごとに書いた まちがいの読み（送りがなは正解と同じ・似ているが ちがう読み）
  take(ITEMS.filter(x=>x.cat===it.cat));
  take(ITEMS);
  return out;
}
const QASK={m:'いみは どれ？', w:'ことばは どれ？', y:'よみ<ruby>方<rt>かた</rt></ruby>は どれ？', c:'（　）に <ruby>入<rt>はい</rt></ruby>る ことばは どれ？'};
function optHTML(x){ return qt==='c' ? ruby(x.c) : qt==='m' ? trH(x) : qt==='y' ? esc(x.y) : ruby(disp(x)); }
// 例文：【 】の所を 空所（問題）／答え（答えた後）にする
const czAns = z => (z[0].match(/【([^】]*)】/)||['',''])[1];
//   文は 分かち書きの切れ目（半角スペース）でだけ 行を分ける（ことばの途中で切れないように、切れ目ごとに .ch で包む）
const czCh = t => t.split(' ').filter(x=>x).map(x=>'<span class="ch">'+ruby(x)+'</span>').join(' ');
const czSent = (z,fill) => czCh(z[0].replace(/【[^】]*】/,'\u0001')).replace('\u0001', fill ? '<span class="fill">'+czCh(czAns(z))+'</span>' : '<span class="blank">　</span>');
function render(){
  cur=queue[pos]; answered=false;
  qt=pickType(cur);
  // 例文が2つ以上ある語（意味や形が2つ以上）は、解くたびに 順に出す
  cz = qt==='c' ? cur.cz[((rec[cur.id]||{}).n||0) % cur.cz.length] : null;
  opts=(qt==='c' ? [{c:czAns(cz)}] : [cur]).concat(pickOthers(cur,qt));
  paintProgress();
  $("qCat").innerHTML=catR(cur.cat);
  $("gPanel").innerHTML=`<div class="gwait">${ic('book')}<span>こたえると ここに<br>ことばの <ruby>説明<rt>せつめい</rt></ruby>が でます</span></div>`;
  $("nextPC").classList.add("hidden");
  $("qText").innerHTML='<span class="qask">'+QASK[qt]+'</span>'
    +(qt==='c' ? '<span class="qsent">'+czSent(cz,false)+'</span>'
      : qt==='w' ? '<span class="qmean">'+trH(cur)+'</span>'
               : '<span class="qword">'+(qt==='y'?esc(cur.p):ruby(disp(cur)))+'</span>');
  order=shuffle(opts.map((_,i)=>i));
  $("choices").innerHTML=order.map((oi,k)=>`<button class="choice${qt==='m'?' en':''}" data-oi="${oi}"><span class="n">${k+1}</span><span>${optHTML(opts[oi])}</span></button>`).join("");
  $("choices").querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
  $("fb").className="fb hidden";
  $("waitHint").classList.remove("hidden"); $("nextBtn").classList.add("hidden");
  $("main").scrollTop=0;
}
function verdictHTML(ok,ansNo){ return `<div class="verdict">${ok?"せいかい！":"ざんねん… せいかいは "+ansNo}</div>`; }
function wordLine(it){
  if(qt==='c') return `<span class="fbw">${ruby(czAns(cz))}</span>　${czTrH(cz)}`;   // 答えた後に、その文での意味（えらんだ言語）を出す
  return `<span class="fbw">${ruby(disp(it))}</span>　${trH(it)}`;
}
function answer(oi){
  if(answered) return; answered=true;
  const ok=oi===0;
  const r=rec[cur.id]||{n:0,ok:0,last:0}; r.n++; if(ok) r.ok++; r.last=ok?1:0; rec[cur.id]=r; save();
  if(ok) score++; else wrongIds.push(cur.id);
  if(ok) sndOK(); else sndNG();
  try{ if(window.__drillLog) window.__drillLog(ok); }catch(e){}
  $("choices").querySelectorAll(".choice").forEach(b=>{
    b.disabled=true; const v=+b.dataset.oi;
    if(v===0){ b.classList.add("ok"); b.querySelector(".n").textContent="○"; }
    else if(v===oi){ b.classList.add("ng"); b.querySelector(".n").textContent="×"; }
    else b.classList.add("dim");
  });
  if(qt==='c'){ const w=$("qText").querySelector(".qsent"); if(w) w.innerHTML=czSent(cz,true); }   // 文の問題は、答えた後に 空所へ答えを入れる
  if(qt==='y'){ const w=$("qText").querySelector(".qword"); if(w) w.innerHTML=ruby(cur.w); }   // よみ方の問題は、答えた後にルビを出す
  const fb=$("fb");
  fb.className="fb "+(ok?"ok":"ng");
  const ansNo=order.indexOf(0)+1;
  fb.innerHTML=verdictHTML(ok,ansNo)+wordLine(cur)
    +`<div class="fbfoot"><div class="fbg">${catR(cur.cat)}</div>`
    +`<button class="morebtn" id="moreBtn">${ic('book')}くわしく</button></div>`;
  $("moreBtn").onclick=()=>openSheet(cur);
  $("nextBtn").innerHTML=(pos+1<queue.length?"つぎへ":"けっかを <ruby>見<rt>み</rt></ruby>る")+ic('fwd');
  $("waitHint").classList.add("hidden"); $("nextBtn").classList.remove("hidden");
  $("nextPC").innerHTML=$("nextBtn").innerHTML; $("nextPC").classList.remove("hidden");
  lastOk=ok; lastAnsNo=ansNo; renderPanel(cur);
}
$("nextBtn").onclick=()=>{ pos++; if(pos<queue.length) render(); else finish(); };
$("nextPC").onclick=()=>$("nextBtn").click();
function paintProgress(){
  if(!cur) return;
  $("qCount").textContent=`${pos+1} / ${queue.length}`;
  $("qBar").style.width=(pos/queue.length*100)+"%";
  if($("qCatH")) $("qCatH").innerHTML=catR(cur.cat);
}

/* ---------- ことばの説明（スマホ＝下から出るシート／PC＝右のパネル。中身は同じ） ---------- */
function sameKanji(it){ return it.ks.length ? ITEMS.filter(x=>x!==it && x.ks.some(k=>it.ks.includes(k))).slice(0,14) : []; }
function detailRows(it){   // よみ・しゅるい・漢字（どこで習うか）・記録
  let h=`<dt>よみ<ruby>方<rt>かた</rt></ruby></dt><dd>${esc(it.y)}</dd>`
    +`<dt>しゅるい</dt><dd>${catR(it.cat)}</dd>`;
  if(it.ks.length){
    h+=`<dt><ruby>漢字<rt>かんじ</rt></ruby></dt><dd><div>${ruby(it.w)}</div>`
      +it.ks.filter(k=>k!=='々').map(k=>`<span class="kjc"><b>${esc(k)}</b><span>${whereKanji(k)}</span></span>`).join("")+`</dd>`;
  }
  return h+`<dt><ruby>記録<rt>きろく</rt></ruby></dt><dd>${recPill(it.id)}</dd>`;
}
function simsHTML(it){
  const sims=sameKanji(it); if(!sims.length) return '';
  return `<div class="shsep"></div><div class="shsim">おなじ <ruby>漢字<rt>かんじ</rt></ruby>の ことば</div>`
    +`<div class="sims">${sims.map(x=>`<button class="sim" data-id="${esc(x.id)}">${ruby(x.w)}</button>`).join("")}</div>`;
}
let lastOk=false, lastAnsNo=1;
function renderPanel(it){
  $("gPanel").innerHTML=`<div class="gv ${lastOk?"ok":"ng"}">${verdictHTML(lastOk,lastAnsNo)}${wordLine(cur)}</div>
    <span class="gname">${ruby(disp(it))}</span><div class="gmean2">${trH(it)}</div>
    <dl class="gtbl">${detailRows(it)}</dl>${simsHTML(it)}`;
  $("gPanel").querySelectorAll(".sim").forEach(b=>b.onclick=()=>renderPanel(BYID[b.dataset.id]));
}
function quit(){ if(pos>0||answered) finish(true); else { show("setup"); updateStats(); } }

function finish(early){
  const done = answered ? pos+1 : pos;
  const total = early ? done : queue.length;
  show("result");
  $("rOk").textContent=score; $("rTot").textContent=" / "+total;
  $("rBar").style.width=(total?score/total*100:0)+"%";
  $("rOk2").textContent="せいかい "+score;
  $("rRate").innerHTML= total? `<ruby>正答率<rt>せいとうりつ</rt></ruby> ${Math.round(score/total*100)}%` : "";
  $("rNg").textContent="まちがい "+(total-score);
  const w=wrongIds.map(id=>BYID[id]);
  $("rWrong").innerHTML = w.length
    ? `<div class="sech">まちがえた ことば</div><div class="list">${w.map(it=>`<div class="wrow"><b>${ruby(disp(it))}</b><span>${trH(it)}</span></div>`).join("")}</div>`
    : `<div class="allok"><ruby>全問<rt>ぜんもん</rt></ruby><ruby>正解<rt>せいかい</rt></ruby>です！</div>`;
  $("retryWrongBtn").disabled=!w.length;
}
$("retryWrongBtn").onclick=()=>start(wrongIds.map(id=>BYID[id]));
$("backBtn").onclick=()=>{ show("setup"); updateStats(); };

let sheetOpen=false;
function recPill(id){
  const r=rec[id];
  return r?`<span class="pill ${r.last?"good":"bad"}">${r.last?"○":"×"} ${r.ok}/${r.n}</span>`:`<span class="pill none">まだ</span>`;
}
function renderSheet(it){
  $("sheet").innerHTML=`<div class="grab"></div>
    <div class="shtop"><span class="tag">${catR(it.cat)}</span><button class="ibtn shclose" id="shClose" aria-label="とじる">${ic('x',2.2)}</button></div>
    <div class="shname" id="shName">${ruby(disp(it))}</div><div class="shmean">${trH(it)}</div>
    <dl class="shtbl">${detailRows(it)}</dl>${simsHTML(it)}
    <button class="shback" id="shBack">もどる</button>`;
  $("shClose").onclick=closeSheet; $("shBack").onclick=closeSheet;
  $("sheet").querySelectorAll(".sim").forEach(b=>b.onclick=()=>{ renderSheet(BYID[b.dataset.id]); $("sheet").scrollTop=0; $("shClose").focus(); });
}
function openSheet(it){ renderSheet(it); $("shov").classList.remove("hidden"); sheetOpen=true; $("sheet").scrollTop=0; $("shClose").focus(); }
function closeSheet(){ $("shov").classList.add("hidden"); sheetOpen=false; const m=$("moreBtn"); if(m&&view==='quiz') m.focus(); }
$("shov").onclick=e=>{ if(e.target===$("shov")) closeSheet(); };

/* ---------- キーボード ---------- */
document.addEventListener("keydown",e=>{
  if(sheetOpen){ if(e.key==="Escape") closeSheet(); return; }
  if(view!=="quiz") return;
  if(!answered && /^[1-4]$/.test(e.key)){ const b=$("choices").children[+e.key-1]; if(b) b.click(); }
  else if(answered && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); $("nextBtn").click(); }
});

/* ---------- リセット ---------- */
$("resetBtn").onclick=()=>$("resetConfirm").classList.remove("hidden");
$("resetNo").onclick=()=>$("resetConfirm").classList.add("hidden");
$("resetYes").onclick=()=>{ rec={}; save(); $("resetConfirm").classList.add("hidden"); updateStats(); };

/* ---------- ことばリスト ---------- */
function renderList(){
  const kw=$("search").value.trim().toLowerCase();
  const hit=ITEMS.filter(it=>!kw||[it.p,it.y,mean(it),catName(it.cat)].join(" ").toLowerCase().includes(kw));   // 漢字でも よみでも 意味でも さがせる
  $("listInfo").innerHTML=`${hit.length} <ruby>語<rt>ご</rt></ruby>`+(kw?`（ぜんぶで ${ITEMS.length}）`:"");
  $("listBody").innerHTML=CAT_ORDER.map(c=>{
    const xs=hit.filter(it=>it.cat===c); if(!xs.length) return "";
    return `<div class="cath" data-h="${esc(c)}"><span>${catR(c)}（${xs.length}）</span><button class="catgo" data-cat="${esc(c)}">${ic('play')}<span>これを<ruby>練習<rt>れんしゅう</rt></ruby></span></button></div>`+
      xs.map(it=>`<div class="gcard" data-id="${esc(it.id)}"><div class="gtop"><span class="gname">${ruby(disp(it))}</span>${recPill(it.id)}</div>
          <div class="gmean">${trH(it)}</div></div>`).join("");
  }).join("");
  $("listBody").querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ catSel.value=b.dataset.cat; setTab("practice"); });
  $("listBody").querySelectorAll(".gcard").forEach(b=>b.onclick=()=>{ if(!isPC()) openSheet(BYID[b.dataset.id]); });
  $("toc").innerHTML=CAT_ORDER.map(c=>{ const n=hit.filter(it=>it.cat===c).length;
    return `<button data-go="${esc(c)}"${n?"":" disabled"}><span>${catR(c)}</span><span class="n">${n}</span></button>`; }).join("");
  $("toc").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const h=$("listBody").querySelector(`.cath[data-h="${CSS.escape(b.dataset.go)}"]`);
    if(h){ $("main").scrollTop=h.offsetTop-$("main").offsetTop-24; markToc(); }
  });
  markToc();
}
function markToc(){
  if(view!=="list"||!isPC()) return;
  const top=$("main").getBoundingClientRect().top+80;
  let curH=null; $("listBody").querySelectorAll(".cath").forEach(h=>{ if(h.getBoundingClientRect().top<=top) curH=h.dataset.h; });
  if(!curH){ const f=$("listBody").querySelector(".cath"); curH=f&&f.dataset.h; }
  $("toc").querySelectorAll("button").forEach(b=>b.classList.toggle("cur",b.dataset.go===curH));
}
$("main").addEventListener("scroll",markToc,{passive:true});
$("search").oninput=renderList;
function setTab(t){ if(t==="list"){ show("list"); renderList(); } else { show("setup"); updateStats(); } }
$("tab-practice").onclick=()=>setTab("practice");
$("tab-list").onclick=()=>setTab("list");

/* ---------- 文字の大きさ（文法ドリルと同じ） ---------- */
const STEPS=[1,1.15,1.3]; let uz=1;
try{ uz=parseFloat(localStorage.getItem('drill_zoom'))||1; }catch(e){}
function fitF(){ const w=window.innerWidth,h=window.innerHeight; if(w<=640) return 1; return Math.max(0.45,Math.min(w/1920,h/1080,2)); }
function applyZoom(){
  uz=Math.min(1.6,Math.max(0.7,Math.round(uz*100)/100));
  const z=fitF()*uz; document.body.style.zoom=z; document.body.style.height=(100/z)+'dvh';
  const b=$("aaBtn"); if(b) b.classList.toggle("on",uz>1.01);
  if($("aMinus")) $("aMinus").disabled=uz<=0.7; if($("aPlus")) $("aPlus").disabled=uz>=1.6;
}
function saveZoom(){ uz=Math.min(1.6,Math.max(0.7,Math.round(uz*100)/100)); try{localStorage.setItem('drill_zoom',uz);}catch(e){} }
function cycleZoom(){ let i=0; STEPS.forEach((s,k)=>{ if(Math.abs(s-uz)<0.05) i=k; }); uz=STEPS[(i+1)%STEPS.length]; try{localStorage.setItem('drill_zoom',uz);}catch(e){} applyZoom(); }
window.addEventListener('resize',applyZoom);
MQ.addEventListener('change',()=>{
  setHeader(view);
  if(view==='quiz'){ paintProgress(); if(answered) renderPanel(cur); }
  if(isPC() && sheetOpen) closeSheet();
  if(view==='list') renderList();
  applyZoom();
});

buildKnown();
applyRuby();
applyZoom();
show("setup");
updateStats();
</script>

// Service Worker 登録（オフライン対応・通信節約）
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/scg-nihongo/sw.js').catch(function(){});});}
