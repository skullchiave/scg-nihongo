function rshuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 一周ごとの再シャッフル。直前の語が新しい先頭に来たら1つずらして連続を防ぐ
function reshufflePool(pool){const last=pool[pool.length-1];pool=rshuffle(pool);if(pool.length>1&&pool[0]===last)pool.push(pool.shift());return pool;}

// ===== sound（Web Audioで合成・外部ファイル不要） =====
let actx=null,soundOn=true;
function tone(freq,delay,dur,type,vol){
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur);
}
function sndOK(){if(!soundOn)return;tone(1318.5,0,0.15,'sine',0.3);tone(1046.5,0.15,0.6,'sine',0.3);}  // ピンポーン
// ブーーー：矩形波1本・音量一定のまっすぐなブザー（終端だけ50msで絞ってクリックノイズ防止）
function sndNG(){
  if(!soundOn)return;
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  const t=actx.currentTime,dur=0.9;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='square';o.frequency.value=110;
  g.gain.setValueAtTime(0.25,t);
  g.gain.setValueAtTime(0.25,t+dur-0.05);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur);
}

/* めくり: iOS文字拡大や長い語でカードからはみ出す時、自動で縮めてカード内に収める保険 */
(function(){
  var grid=document.getElementById('flipgrid');
  if(!grid) return;
  function fitOne(face){
    var wrap=face.querySelector(':scope > .fitwrap');
    if(!wrap){
      wrap=document.createElement('span'); wrap.className='fitwrap';
      while(face.firstChild) wrap.appendChild(face.firstChild);
      face.appendChild(wrap);
    }
    wrap.style.transform='';
    var cw=face.clientWidth, ch=face.clientHeight, sw=wrap.scrollWidth, sh=wrap.scrollHeight;
    if(!cw||!sw) return;                 /* 非表示中(0px)はスキップ */
    var s=Math.min(cw/sw, ch/sh, 1);
    if(s<0.99) wrap.style.transform='scale('+(s*0.96).toFixed(3)+')';
  }
  function fit(){ requestAnimationFrame(function(){ grid.querySelectorAll('.face').forEach(fitOne); }); }
  new MutationObserver(fit).observe(grid,{childList:true});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ if(es.some(function(e){return e.isIntersecting;})) fit(); }).observe(grid);
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',fit);
  fit();
})();
