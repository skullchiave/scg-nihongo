<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="/scg-nihongo/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/scg-nihongo/icon-192.png">
<link rel="manifest" href="/scg-nihongo/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="SCG日本語">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>SCG日本語 ドリル</title>
<style>
@font-face{font-family:'BIZ UDPGothic';font-style:normal;font-weight:400;font-display:swap;src:url('/scg-nihongo/fonts/BIZUDPGothic-Regular.subset.woff2') format('woff2');}
@font-face{font-family:'BIZ UDPGothic';font-style:normal;font-weight:700;font-display:swap;src:url('/scg-nihongo/fonts/BIZUDPGothic-Bold.subset.woff2') format('woff2');}
:root{
  --g1:#dc2626; --g2:#1d4ed8; --g3:#15803d;
  --bg:#eef1f7; --panel:#ffffff; --ink:#16233a; --sub:#5a6b86; --line:#c9d4e6;
  --accent:#e8920c; --accentT:#b45309;
  --accentStrong:#d97706; --accentSoft:#fff3e0; --muted:#3c4c66; --hair:#dfe5ef;
  --card-shadow:0 1px 2px rgba(22,35,58,.06),0 4px 16px rgba(22,35,58,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink);
  min-height:100dvh;}
ruby rt{font-size:0.55em;font-weight:500;opacity:.85;}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;}
.ic{width:22px;height:22px;flex-shrink:0;display:block;}

/* ヘッダー */
.hd{background:#fff;border-bottom:1px solid var(--hair);}
.hdin{max-width:480px;margin:0 auto;padding:10px 16px;min-height:64px;display:flex;align-items:center;gap:8px;}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.brand img{height:26px;width:auto;flex-shrink:0;}
.brand h1{font-size:21px;font-weight:700;line-height:1.3;white-space:nowrap;}
.brand h1 .em{color:var(--accentStrong);}
.ibtn{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;background:#fff;
  border:1px solid var(--line);border-radius:12px;color:var(--ink);cursor:pointer;}
.ibtn:active{transform:scale(.96);}
.ibtn.back{border-color:transparent;margin-left:-10px;}
.hdsmall{font-size:13px;color:var(--sub);font-weight:700;}
.hdtitle{max-width:480px;margin:0 auto;padding:0 16px 14px;font-size:24px;font-weight:700;line-height:1.35;}

.page{max-width:480px;margin:0 auto;padding:18px 16px 32px;}

/* ホーム：あいさつ */
.hello .s{font-size:13px;color:var(--sub);font-weight:700;}
.hello .s b{color:var(--accentT);font-size:1.15em;}
.hello .q{font-size:24px;font-weight:700;margin-top:2px;line-height:1.4;}

/* ホーム：教科書の練習（メインカード） */
.mcard{display:block;background:#fff;border-radius:20px;box-shadow:var(--card-shadow);padding:20px;margin-top:16px;}
.mcard:active{transform:scale(.99);}
.mtop{display:flex;justify-content:space-between;align-items:center;}
.icobox{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:var(--accentSoft);color:var(--accentT);flex-shrink:0;}
.icobox .ic{width:26px;height:26px;}
.gopill{height:36px;padding:0 10px 0 16px;border-radius:999px;background:var(--ink);color:#fff;
  font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:2px;}
.gopill .ic{width:18px;height:18px;}
.mtitle{font-size:22px;font-weight:700;margin-top:14px;line-height:1.4;}
.msub{font-size:14px;color:var(--sub);margin-top:2px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.chip{font-size:12px;background:var(--bg);border-radius:999px;padding:4px 10px;color:var(--muted);font-weight:700;}

/* ホーム：ドリル・問題（2列） */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.scard{display:block;background:#fff;border-radius:16px;box-shadow:var(--card-shadow);padding:16px;}
.scard .icobox{width:40px;height:40px;border-radius:12px;}
.scard .icobox .ic{width:22px;height:22px;}
.stitle{font-size:17px;font-weight:700;margin-top:10px;line-height:1.4;}
.ssub{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5;}
.scard.soon{background:#f7f9fc;border:1.5px dashed var(--line);box-shadow:none;cursor:default;}
.scard.soon .icobox{background:#e6ebf3;color:var(--sub);}
.scard.soon .stitle{color:var(--muted);}
.soonlbl{font-size:11px;font-weight:700;color:var(--sub);margin-top:6px;}

/* ホーム：おしらせ */
.newsbtn{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;box-shadow:var(--card-shadow);
  padding:8px 12px 8px 16px;min-height:56px;margin-top:12px;font-size:15px;font-weight:700;}
.newsbtn > .ic{color:var(--sub);}
.newpill{font-size:11px;font-weight:700;color:#fff;background:#dc2626;border-radius:999px;padding:2px 8px;flex-shrink:0;}
.go{margin-left:auto;color:#8a98b0;flex-shrink:0;}

/* ホーム：フッター */
.foot{text-align:center;margin-top:24px;}
.foot .s{font-size:13px;color:var(--sub);margin-bottom:8px;}
.mailbtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;background:#fff;
  border:1px solid var(--line);border-radius:12px;font-size:15px;font-weight:700;}
.mailbtn .ic{width:20px;height:20px;color:var(--sub);}

/* 課一覧 */
.lsec{margin-top:20px;}
.lsec:first-child{margin-top:2px;}
.lh{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--accentT);margin-bottom:8px;}
.lh::after{content:"";flex:1;height:1px;background:#d6deeb;}
.list{background:#fff;border-radius:16px;box-shadow:var(--card-shadow);overflow:hidden;}
.row{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px 10px 16px;border-top:1px solid #edf1f7;}
.row:first-child{border-top:none;}
.row:active{background:#f7f9fc;}
.row .nm{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.5;}
.row.soon{cursor:default;}
.row .cnt{font-size:13px;color:var(--sub);white-space:nowrap;flex-shrink:0;}
.row .nm .sub{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:1px;}
.row.soon .nm{color:var(--sub);}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--sub);background:#e6ebf3;
  border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;}

/* じゅんびちゅう画面 */
.soonbox{text-align:center;background:#f7f9fc;border:1.5px dashed var(--line);border-radius:16px;
  padding:40px 20px;color:var(--sub);font-size:16px;line-height:1.8;}
.soonbox .big{font-size:22px;font-weight:700;color:var(--muted);margin-bottom:8px;}

/* おしらせ・更新履歴 */
.news{display:flex;flex-direction:column;gap:12px;}
.nitem{background:#fff;border-radius:16px;box-shadow:var(--card-shadow);padding:14px 16px;}
.nmeta{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.ndate{font-size:13px;color:var(--sub);font-weight:700;}
.utag{font-size:11px;font-weight:700;color:#fff;background:var(--sub);border-radius:999px;padding:3px 10px;white-space:nowrap;}
.utag.feat{background:var(--g2);}
.utag.fix{background:var(--g3);}
.utag.drill{background:var(--accentT);}
.ntext{font-size:15px;line-height:1.7;}

/* QRコード（投影＝PC幅だけ。スマホでは出さない＝再配布に小さな摩擦を残す） */
.qrov{position:fixed;inset:0;background:rgba(16,28,48,.85);z-index:1000;display:none;
  align-items:center;justify-content:center;padding:24px;}
.qrov.on{display:flex;}
.qrbox{background:#fff;border-radius:24px;padding:clamp(22px,4vw,40px);text-align:center;
  max-width:min(94vw,560px);box-shadow:0 12px 44px rgba(0,0,0,.45);}
.qrttl{font-size:clamp(18px,4.5vw,26px);font-weight:800;margin-bottom:18px;line-height:1.5;}
.qrsvg{width:min(72vw,62vh,440px);height:auto;display:block;margin:0 auto;}
.qrurl{margin-top:16px;font-size:clamp(11px,3vw,15px);color:var(--sub);word-break:break-all;font-family:monospace;}
.qrclose{margin-top:22px;background:#eef2f8;color:var(--ink);border:1px solid var(--line);border-radius:12px;
  min-height:48px;padding:12px 30px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;}

@media (max-width:640px){ .qronly{display:none;} }

/* ===== PC版ホーム（641px以上）。寸法は 1920×1080 基準。fitZoom() が画面に合わせて全体を縮める =====
   スマホ版（.sphome）は触らない。PC版（.pchome）は PC 幅でだけ出す */
.pchome{display:none;}
@media (min-width:641px){
  .sphome{display:none;}
  .pchome{display:block;}
  .pchd{background:#fff;border-bottom:1px solid var(--hair);}
  .pchdin{max-width:1816px;margin:0 auto;padding:0 48px;height:104px;display:flex;align-items:center;gap:20px;}
  .pchdin .brand img{height:48px;}
  .pchdin .brand h1{font-size:40px;}
  .pcnews{height:64px;display:inline-flex;align-items:center;gap:12px;padding:0 24px;border:1px solid var(--line);border-radius:16px;
    background:#fff;font-size:24px;font-weight:700;}
  .pcnews .ic{width:30px;height:30px;color:var(--sub);}
  .pcnews .newpill{font-size:18px;padding:3px 12px;}
  .pcmain{max-width:1816px;margin:0 auto;padding:36px 48px 40px;display:grid;grid-template-columns:minmax(0,1fr) 480px;column-gap:40px;
    grid-template-areas:"hello hello" "left right";}
  .pchello{grid-area:hello;margin-bottom:24px;}
  .pchello .s{font-size:24px;color:var(--sub);font-weight:700;}
  .pchello .s b{color:var(--accentT);}
  .pchello .q{font-size:52px;font-weight:700;line-height:1.4;}
  .pcleft{grid-area:left;display:flex;flex-direction:column;gap:24px;min-width:0;}
  .pcright{grid-area:right;display:flex;flex-direction:column;gap:24px;}
  .pctb{display:flex;align-items:center;gap:32px;background:#fff;border-radius:28px;box-shadow:var(--card-shadow);padding:32px 36px;}
  .pctb:active{transform:scale(.995);}
  .pcico{width:112px;height:112px;border-radius:28px;display:grid;place-items:center;background:var(--accentSoft);color:var(--accentT);flex-shrink:0;}
  .pcico .ic{width:60px;height:60px;}
  .pctb .t{font-size:48px;font-weight:700;line-height:1.45;}
  .pctb .s{font-size:26px;color:var(--sub);margin-top:4px;}
  .pctb .go{margin-left:auto;color:var(--ink);}
  .pctb .go .ic{width:56px;height:56px;}
  .pcdr{background:#fff;border-radius:28px;box-shadow:var(--card-shadow);padding:28px 36px 32px;}
  .pcdrh{display:flex;align-items:center;gap:20px;}
  .pcdrh .pcico{width:72px;height:72px;border-radius:20px;}
  .pcdrh .pcico .ic{width:38px;height:38px;}
  .pcdrh .t{font-size:40px;font-weight:700;line-height:1.3;}
  .pcdrh .s{font-size:22px;color:var(--sub);}
  .lvtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:24px;}
  .lvt{height:120px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .lvt .lv{font-size:44px;font-weight:700;line-height:1.1;}
  .lvt .k{font-size:22px;font-weight:700;line-height:1.5;}
  a.lvt{background:var(--ink);color:#fff;}
  a.lvt .k{color:#c9d4e6;}
  a.lvt:active{transform:scale(.98);}
  .lvt.soon{background:#f7f9fc;border:2px dashed var(--line);color:var(--sub);cursor:default;}
  .lvt.soon .lv{color:#8a98b0;}
  .lvt.soon .k{font-size:18px;}
  .pcquiz{display:flex;align-items:center;gap:20px;background:#f7f9fc;border:2px dashed var(--line);border-radius:24px;padding:20px 36px;color:var(--sub);}
  .pcquiz .pcico{width:64px;height:64px;border-radius:18px;background:#e6ebf3;color:var(--sub);}
  .pcquiz .pcico .ic{width:34px;height:34px;}
  .pcquiz .t{font-size:32px;font-weight:700;color:var(--muted);}
  .pcquiz .s{font-size:22px;}
  .pcquiz .soonlbl{margin:0 0 0 auto;font-size:22px;}
  .qrbig{flex:1;min-height:520px;width:100%;border:none;border-radius:28px;background:var(--ink);color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;font-family:inherit;}
  .qrbig:active{transform:scale(.99);}
  .qrframe{width:200px;height:200px;border-radius:24px;background:#fff;color:var(--ink);display:grid;place-items:center;margin-bottom:8px;}
  .qrframe .ic{width:128px;height:128px;}
  .qrbig .t{font-size:40px;font-weight:700;line-height:1.4;}
  .qrbig .s{font-size:24px;color:#c9d4e6;line-height:1.6;}
  .pcmail{background:#fff;border-radius:24px;box-shadow:var(--card-shadow);padding:24px;text-align:center;}
  .pcmail .s{font-size:22px;color:var(--sub);margin-bottom:12px;}
  .pcmail .mailbtn{height:64px;font-size:24px;padding:0 28px;border-radius:16px;}
  .pcmail .mailbtn .ic{width:28px;height:28px;}
  /* QRの拡大表示（投影用：画面の高さの7割ぐらい） */
  .qrov{padding:1.5vh;}
  .qrbox{max-width:none;padding:2.5vh 4vh;}
  .qrttl{font-size:3.4vh;margin-bottom:1.6vh;}
  .qrsvg{width:68vh;max-width:90vw;}
  .qrurl{font-size:2vh;margin-top:1.2vh;}
  .qrclose{margin-top:1.8vh;min-height:6vh;font-size:2.4vh;padding:0 5vh;}
}
</style>
</head>

// ===== ヘッダー =====

  return '<div class="soonbox"><div class="big">'+name+'</div>いま じゅんびちゅうです。<br>もうすこし まってください。</div>';

function isNewsUnread(){try{var seen=localStorage.getItem('news_seen');return DATA.updates.length>0 && (!seen || seen<DATA.updates[0].date);}catch(e){return false;}}
function markNewsSeen(){try{if(DATA.updates.length>0)localStorage.setItem('news_seen',DATA.updates[0].date);}catch(e){}}
function fmtDate(s){var p=s.split('-');return p.length===3?p[0]+'/'+(+p[1])+'/'+(+p[2]):s;}
// 連続学習日数（端末ローカル・サイトを開いた日をカウント。切れたら黙って1にもどす＝責めない）
function updateStreak(){
  try{
    var d=new Date();
    var ymd=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var st=JSON.parse(localStorage.getItem('drill_streak')||'{}');
    if(st.last!==ymd){
      var diff=st.last?Math.round((new Date(ymd+'T00:00:00')-new Date(st.last+'T00:00:00'))/86400000):null;
      st.streak=(diff===1)?(st.streak||0)+1:1;   // 昨日に続けて＝+1／初回・2日以上あき＝1
      st.last=ymd; st.best=Math.max(st.best||0,st.streak);
      localStorage.setItem('drill_streak',JSON.stringify(st));
    }
  }catch(e){}
}
// あいさつの1行目（連続日数があれば文字で出す。絵文字は使わない）
function helloLine(){
  var n=0;
  try{ n=(JSON.parse(localStorage.getItem('drill_streak')||'{}').streak)||0; }catch(e){}
  if(n<2) return 'きょうも べんきょう、いいね！';
  var praise=(n>=7)?' すごい！':(n>=3?' えらい！':'');
  return '<b>'+n+'</b>にち つづけて べんきょう！'+praise;
}

    +ic('mail')+'<span><ruby>佐々木<rt>ささき</rt></ruby>に メールする</span></a>';
}
function newsButtonHTML(){
  return '<a class="newsbtn" href="#/news">'+ic('bell')
    +'<span>おしらせ・<ruby>更新<rt>こうしん</rt></ruby><ruby>履歴<rt>りれき</rt></ruby></span>'
    +(isNewsUnread()?'<span class="newpill">NEW</span>':'')
    +'<span class="go">'+ic('fwd')+'</span></a>';
}
// 教科書カードのチップ（教科書名＋課の範囲。DATA から自動で作る）
function textbookChips(){
  var h='';
  DATA.textbooks.filter(function(t){return t.ready;}).forEach(function(t){
    var ns=DATA.drills.filter(function(d){return d.tb===t.id && d.ready;})
      .map(function(d){return parseInt(String(d.lesson).replace(/\D/g,''),10);}).filter(function(n){return !isNaN(n);});
    h+='<span class="chip">'+t.label+'</span>';
    if(ns.length) h+='<span class="chip">L'+Math.min.apply(null,ns)+'〜L'+Math.max.apply(null,ns)+'</span>';
  });
  return h;
}
function viewNews(){
  let h=hdSub('#/','ホーム','おしらせ・<ruby>更新<rt>こうしん</rt></ruby><ruby>履歴<rt>りれき</rt></ruby>')+'<main class="page"><div class="news">';
  DATA.updates.forEach(function(u){
    h+='<div class="nitem"><div class="nmeta"><span class="ndate">'+fmtDate(u.date)+'</span>'
      +'<span class="utag '+(u.cls||'')+'">'+u.tag+'</span></div>'
      +'<div class="ntext">'+u.text+'</div></div>';
  });
  return h+'</div>'+footHTML()+'</main>';
}
function viewHome(){
  let h=hdHome()+'<main class="page">';
  h+='<div class="hello"><div class="s">'+helloLine()+'</div><div class="q">なにを れんしゅうする？</div></div>';
  const main=DATA.categories[0], rest=DATA.categories.slice(1);
  h+='<a class="mcard" href="#/'+main.id+'"><div class="mtop"><span class="icobox">'+ic(CAT_ICON[main.id]||'book')+'</span>'
    +'<span class="gopill">はじめる'+ic('fwd')+'</span></div>'
    +'<div class="mtitle">'+main.label+'</div><div class="msub">'+main.sub+'</div>'
    +(main.id==='textbook'?'<div class="chips">'+textbookChips()+'</div>':'')+'</a>';
  h+='<div class="grid2">';
  rest.forEach(function(c){
    const inner='<span class="icobox">'+ic(CAT_ICON[c.id]||'book')+'</span>'
      +'<div class="stitle">'+c.label+'</div><div class="ssub">'+c.sub+'</div>';
    if(c.ready) h+='<a class="scard" href="#/'+c.id+'">'+inner+'</a>';
    else h+='<div class="scard soon" aria-disabled="true">'+inner+'<div class="soonlbl">じゅんびちゅう</div></div>';
  });
  h+='</div>';
  h+=newsButtonHTML();
  return '<div class="sphome">'+h+footHTML()+'</main></div>'+viewHomePC();
}
// PC版ホーム（投影・QR用。641px以上でだけ見える。寸法は1920×1080基準）
function viewHomePC(){
  const main=DATA.categories[0], drill=DATA.categories.find(function(c){return c.id==='drill';}), quiz=DATA.categories.find(function(c){return c.id==='quiz';});
  let h='<div class="pchome"><header class="pchd"><div class="pchdin">'
    +'<div class="brand"><img src="logo-mark.png" alt=""><h1>SCG<ruby>日本語<rt>にほんご</rt></ruby> <span class="em">ドリル</span></h1></div>'
    +'<a class="pcnews" href="#/news">'+ic('bell')+'<span>おしらせ</span>'+(isNewsUnread()?'<span class="newpill">NEW</span>':'')+'</a>'
    +'</div></header><main class="pcmain">';
  h+='<div class="pchello"><div class="s">'+helloLine()+'</div><div class="q">なにを れんしゅうする？</div></div>';
  h+='<div class="pcleft">';
  // 教科書の練習
  const chips=[];
  readyTextbooks().forEach(function(t){
    var ns=DATA.drills.filter(function(d){return d.tb===t.id && d.ready;})
      .map(function(d){return parseInt(String(d.lesson).replace(/\D/g,''),10);}).filter(function(n){return !isNaN(n);});
    chips.push(t.label+(ns.length?' L'+Math.min.apply(null,ns)+'〜L'+Math.max.apply(null,ns):''));
  });
  h+='<a class="pctb" href="#/'+main.id+'"><span class="pcico">'+ic('book')+'</span><span><span class="t" style="display:block">'+main.label+'</span>'
    +'<span class="s" style="display:block">'+chips.join('／')+'</span></span><span class="go">'+ic('fwd')+'</span></a>';
  // ドリル（N4→N1 のタイル）
  if(drill){
    h+='<div class="pcdr"><div class="pcdrh"><span class="pcico">'+ic('pencil')+'</span><span><span class="t" style="display:block">'+drill.label+'</span>'
      +'<span class="s" style="display:block">'+drill.sub+'</span></span></div><div class="lvtiles">';
    (window.SCG_CATALOG.jlpt||[]).slice().reverse().forEach(function(lv){
      const items=(lv.items||[]).filter(function(it){return it.ready;});
      if(lv.ready && items.length){
        const href=items.length===1?items[0].file:'#/drill/'+lv.id;
        const kinds=items.map(function(it){return it.label;}).join('・');
        h+='<a class="lvt" href="'+href+'"><span class="lv">'+lv.label+'</span><span class="k">'+kinds+'</span></a>';
      }else{
        h+='<div class="lvt soon" aria-disabled="true"><span class="lv">'+lv.label+'</span><span class="k">じゅんびちゅう</span></div>';
      }
    });
    h+='</div></div>';
  }
  // 問題（準備中なら点線の帯）
  if(quiz){
    const inner='<span class="pcico">'+ic('quiz')+'</span><span><span class="t" style="display:block">'+quiz.label+'</span><span class="s" style="display:block">'+quiz.sub+'</span></span>';
    h+= quiz.ready ? '<a class="pctb" href="#/quiz">'+inner+'<span class="go">'+ic('fwd')+'</span></a>'
                   : '<div class="pcquiz" aria-disabled="true">'+inner+'<span class="soonlbl">じゅんびちゅう</span></div>';
  }
  h+='</div><div class="pcright">';
  h+='<button class="qrbig" onclick="openQR()"><span class="qrframe">'+ic('qr')+'</span>'
    +'<span class="t">QRコードを <ruby>表示<rt>ひょうじ</rt></ruby></span><span class="s">スマホで よみとってね（<ruby>学生<rt>がくせい</rt></ruby><ruby>用<rt>よう</rt></ruby>）</span></button>';
  h+='<div class="pcmail"><div class="s"><ruby>要望<rt>ようぼう</rt></ruby>・<ruby>質問<rt>しつもん</rt></ruby>は</div>'+mailBtnHTML()+'</div>';
  return h+'</div></main></div>';
}
function readyTextbooks(){ return DATA.textbooks.filter(function(t){return t.ready;}); }
function viewTextbookList(){
  // 教科書が1つだけなら、その課一覧へそのまま進む（1タップ減らす）
  const rt=readyTextbooks();
  if(rt.length===1 && DATA.textbooks.length===1){ location.replace('#/textbook/'+rt[0].id); return null; }
  let h=hdSub('#/','ホーム','<ruby>教科書<rt>きょうかしょ</rt></ruby>の<ruby>練習<rt>れんしゅう</rt></ruby>')+'<main class="page"><div class="list">';
  DATA.textbooks.forEach(function(t){
    if(t.ready) h+='<a class="row" href="#/textbook/'+t.id+'"><span class="nm">'+t.label+'</span><span class="go">'+ic('fwd')+'</span></a>';
    else h+='<div class="row soon"><span class="nm">'+t.label+'<span class="badge">じゅんびちゅう</span></span></div>';
  });
  return h+'</div></main>';
}
function viewTextbook(tbId){
  const tb=DATA.textbooks.find(function(t){return t.id===tbId;});
  if(!tb) return viewHome();
  const back=(DATA.textbooks.length===1)?'#/':'#/textbook';
  let h=hdSub(back,'<ruby>教科書<rt>きょうかしょ</rt></ruby>の<ruby>練習<rt>れんしゅう</rt></ruby>',tb.label)+'<main class="page">';
  const ds=DATA.drills.filter(function(d){return d.tb===tbId;});
  const lessons=[];
  ds.forEach(function(d){ if(lessons.indexOf(d.lesson)<0) lessons.push(d.lesson); });
  lessons.forEach(function(L){
    h+='<section class="lsec"><div class="lh">'+L+'</div><div class="list">';
    ds.filter(function(d){return d.lesson===L;}).forEach(function(d){
      if(d.ready){
        h+='<a class="row" href="'+d.file+'"><span class="nm">'+d.label+'</span><span class="go">'+ic('fwd')+'</span></a>';
      }else{
        h+='<div class="row soon" aria-disabled="true"><span class="nm">'+d.label+'<span class="badge">じゅんびちゅう</span></span></div>';
      }
    });
    h+='</div></section>';
  });
  return h+'</main>';
}
// ===== ドリル（JLPT）: レベル一覧 → 文法・語彙 =====
function soonRow(label){ return '<div class="row soon" aria-disabled="true"><span class="nm">'+label+'<span class="badge">じゅんびちゅう</span></span></div>'; }
function viewDrill(){
  let h=hdSub('#/','ホーム','ドリル')+'<main class="page"><section class="lsec"><div class="lh">JLPT</div><div class="list">';
  (window.SCG_CATALOG.jlpt||[]).forEach(function(lv){
    h+= lv.ready ? '<a class="row" href="#/drill/'+lv.id+'"><span class="nm">'+lv.label+'</span><span class="go">'+ic('fwd')+'</span></a>' : soonRow(lv.label);
  });
  return h+'</div></section></main>';
}
function viewDrillLevel(id){
  const lv=(window.SCG_CATALOG.jlpt||[]).find(function(x){return x.id===id && x.ready;});
  if(!lv) return viewDrill();
  let h=hdSub('#/drill','ドリル','JLPT '+lv.label)+'<main class="page"><div class="list">';
  (lv.items||[]).forEach(function(it){
    h+= it.ready ? '<a class="row" href="'+it.file+'"><span class="nm">'+it.label+(it.sub?'<span class="sub">'+it.sub+'</span>':'')+'</span>'+(it.count?'<span class="cnt">'+it.count+'</span>':'')+'<span class="go">'+ic('fwd')+'</span></a>' : soonRow(it.label);
  });
  return h+'</div></main>';
}
function render(){
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  let html;
  if(parts.length===0){ html=viewHome(); }
  else if(parts[0]==='news'){ html=viewNews(); markNewsSeen(); }
  else if(parts[0]==='textbook' && parts.length===1){ html=viewTextbookList(); }
  else if(parts[0]==='textbook'){ html=viewTextbook(parts[1]); }
  else if(parts[0]==='drill' && parts.length===1){ html=viewDrill(); }
  else if(parts[0]==='drill'){ html=viewDrillLevel(parts[1]); }
  else if(parts[0]==='quiz'){ html=hdSub('#/','ホーム','<ruby>問題<rt>もんだい</rt></ruby>')+'<main class="page">'+soonHTML('<ruby>問題<rt>もんだい</rt></ruby>')+'</main>'; }
  else { html=viewHome(); }
  if(html===null) return;   // 転送した（hashchange でもう一度 render される）
  app.innerHTML=html;
  fitZoom();
  window.scrollTo(0,0);
}
// 投影（PC幅）では画面に合わせて拡大する。スマホ（640px以下）は等倍
// ホームのPC版は1920×1080基準で作ってあるので、その比率で縮める。ほかの画面はスマホの並びのまま拡大する
function fitZoom(){
  var w=window.innerWidth, h=window.innerHeight, z=1;
  var home=location.hash.replace(/^#\/?/,'')==='';
  if(w>640 && home){ z=Math.max(0.45, Math.min(w/1920, h/1080, 2)); }
  else if(w>640){ z=Math.min(w/560, h/880); z=Math.max(1, Math.min(z, 2.4)); }
  app.style.zoom=z;
}
window.addEventListener('resize',fitZoom);
window.addEventListener('hashchange',render);
updateStreak();
fitZoom();
render();
</script>
